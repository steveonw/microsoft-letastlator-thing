name: Chunk 3 verification

on:
  push:
    branches:
      - feature/chunk-3-evidence-layer
  pull_request:
    paths:
      - "backend/evidence.py"
      - "backend/build_evidence_demo.py"
      - "backend/test_evidence.py"
      - "data/evidence/**"
      - ".github/workflows/chunk3-check.yml"
  workflow_dispatch:

jobs:
  verify-chunk-3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run evidence-layer tests
        run: python backend/test_evidence.py

      - name: Build live real-source evidence demo
        run: |
          python backend/build_evidence_demo.py \
            --output /tmp/policytrace-chunk3.json

      - name: Validate claim-to-evidence-to-source chain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/policytrace-chunk3.json").read_text(encoding="utf-8")
          )

          sources = {source["id"]: source for source in data["sources"]}
          evidence = {item["id"]: item for item in data["evidence"]}
          claim = data["steps"][0]["claims"][0]

          assert claim["evidence_ids"]

          for evidence_id in claim["evidence_ids"]:
              item = evidence[evidence_id]
              source = sources[item["source_id"]]
              start = item["start_offset"]
              end = item["end_offset"]

              assert source["raw_text"][start:end] == item["snippet"]
              assert item["locator"]

          print(
              f"Verified {len(claim['evidence_ids'])} claim citation(s) "
              "against exact source text."
          )
          PY
