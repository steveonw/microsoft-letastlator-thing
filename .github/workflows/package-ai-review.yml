name: Package PolicyTrace review snapshot

on:
  push:
    branches:
      - fix/contest-phase1-comment-resilience
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create review snapshot
        run: |
          zip -qr PolicyTrace-source.zip . -x ".git/*"

      - name: Upload review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: PolicyTrace-source
          path: PolicyTrace-source.zip
          if-no-files-found: error
          retention-days: 7
